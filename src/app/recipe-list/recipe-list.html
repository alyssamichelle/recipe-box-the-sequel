<section class="recipe-list">
  <fieldset class="recipe-list__picker">
    <legend class="recipe-list__legend" id="recipe-list-legend">Recipe</legend>
    <div class="recipe-list__radios" role="radiogroup" aria-labelledby="recipe-list-legend">
      @for (r of recipes; track r.id) {
        <label class="recipe-list__choice">
          <input
            type="radio"
            [value]="slugify(r.name)"
            [formField]="pickerForm.recipeSlug"
            (change)="onRecipeChange()"
          />
          {{ r.name }}
        </label>
      }
    </div>
    @if (pickerForm.recipeSlug().touched() && pickerForm.recipeSlug().invalid()) {
      <ul class="recipe-list__errors" role="alert">
        @for (error of pickerForm.recipeSlug().errors(); track error) {
          <li>{{ error.message }}</li>
        }
      </ul>
    }
  </fieldset>

  <app-recipe-detail [recipe]="recipe()" />
</section>
